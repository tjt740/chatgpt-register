<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adobe 注册 · ChatGPT 注册管理</title>
<link rel="stylesheet" href="/static/style.css?v=17">
<style>
body[data-page="adobe"] .adobe-export-string { --export-color:#2563eb; }
body[data-page="adobe"] .adobe-export-json { --export-color:#15803d; }
body[data-page="adobe"] .adobe-export-array { --export-color:#b45309; }
body[data-page="adobe"] .adobe-export-email { --export-color:#0e7490; }
#adobe-batch .px-btn.adobe-export,
body[data-page="adobe"] .px-btn.adobe-export {
  background:var(--export-color); border-color:var(--export-color); color:#fff;
}
body[data-page="adobe"] .px-btn.adobe-export:hover:not(:disabled) { filter:brightness(1.1); color:#fff; }
body[data-page="adobe"] .px-btn.adobe-export:focus-visible { outline:2px solid var(--export-color); outline-offset:3px; }
body[data-page="adobe"] .px-select-opt.adobe-export { color:var(--export-color); }
.adobe-info { min-width:200px; max-width:320px; font-size:12px; line-height:1.6; color:var(--text-3); white-space:pre-wrap; overflow-wrap:anywhere; }
.adobe-status-cell { white-space:nowrap; }
#adobe-batch { flex-wrap:wrap; }
#adobe-batch-help { flex-basis:100%; color:var(--text-3); font-size:12px; line-height:1.6; }
#adobe-action-result { margin:12px 0; white-space:pre-wrap; overflow-wrap:anywhere; }
body[data-page="adobe"] .px-btn:disabled { opacity:.4; cursor:not-allowed; box-shadow:none; }
body[data-page="adobe"] .badge { white-space:nowrap; }
.adobe-row-actions { display:flex; flex-wrap:wrap; gap:6px; min-width:220px; max-width:300px; }
.adobe-row-actions .px-btn { padding:5px 10px; font-size:12px; white-space:nowrap; }
.adobe-browser-mode { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-bottom:16px; font-size:13px; }
.adobe-browser-mode label { display:flex; gap:8px; align-items:center; cursor:pointer; }
.adobe-browser-mode input { accent-color:var(--primary); }
#adobe-mode-hint { color:var(--text-3); }
  </style>
</head>
<body data-page="adobe">
<div class="layout">
  <main class="main">
    <h1 class="page-title">Adobe 注册</h1>

    <!-- 生产进度概览 -->
    <div class="produce-bar" id="produce-bar">
      <div class="produce-stat"><span class="produce-num" id="pd-pending">0</span><span class="produce-lbl">待生产</span></div>
      <span class="produce-dot">·</span>
      <div class="produce-stat"><span class="produce-num running" id="pd-running">0</span><span class="produce-lbl">在跑</span></div>
      <span class="produce-dot">·</span>
      <div class="produce-stat"><span class="produce-num ok" id="pd-registered">0</span><span class="produce-lbl">已注册</span></div>
      <span class="produce-dot">·</span>
      <div class="produce-stat"><span class="produce-num bad" id="pd-failed">0</span><span class="produce-lbl">生产失败</span></div>
      <div class="produce-actions">
        <button class="px-btn danger" id="pd-stop" style="display:none" onclick="stopProduce()">停止</button>
      </div>
    </div>

    <div class="adobe-browser-mode">
      <label><input id="adobe-headless" type="checkbox" role="switch" checked disabled onchange="saveAdobeBrowserMode()">无头浏览器模式</label>
      <span id="adobe-mode-hint" role="status">默认开启，在后台运行；关闭后显示浏览器窗口。对新启动的任务生效。</span>
    </div>
    <div class="toolbar">
      <input id="search" class="px-input search" placeholder="搜索 Adobe email / 备注 ...">
      <select id="filter-status" class="px-input">
        <option value="">全部状态</option>
        <option value="pending">待注册</option>
        <option value="registering">注册中</option>
        <option value="waiting_code">等待验证码</option>
        <option value="registered">已注册</option>
        <option value="register_failed">注册失败</option>
      </select>
      <button class="px-btn primary" id="produce-btn" onclick="openProduceModal()">生产</button>
      <div class="px-select" title="导出全部已注册未出库的账号">
        <button type="button" class="px-select-btn" onclick="toggleExportUnshipped(event)">
          <span class="px-select-label">导出未出库</span>
          <svg class="px-select-arrow" viewBox="0 0 24 24"><path d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
        </button>
        <div class="px-select-menu">
          <button type="button" class="px-select-opt adobe-export adobe-export-string" onclick="downloadUnshipped('string')">Cookie 字符串</button>
          <button type="button" class="px-select-opt adobe-export adobe-export-json" onclick="downloadUnshipped('json')">Cookie JSON</button>
          <button type="button" class="px-select-opt adobe-export adobe-export-array" onclick="downloadUnshipped('array')">Cookie 数组</button>
        </div>
      </div>
      <button class="px-btn" onclick="liveCheckAll()">测活</button>
      <button class="px-btn" onclick="rescueDead()" title="对全部失效(dead)且有会话的号自动过 ride 身份核验">批量救回失效号</button>
      <button class="px-btn danger" onclick="deleteAllAdobe()">全部删除</button>
      <span id="live-progress" class="live-progress" style="display:none"></span>
    </div>

    <div class="batch-bar" id="adobe-batch" style="display:none">
      <span id="adobe-batch-count">已选 0 项</span>
      <button class="px-btn primary" data-adobe-action="retry" onclick="retrySelected()">重试所选</button>
      <button class="px-btn" data-adobe-action="stop" onclick="stopSelected()">停止所选</button>
      <button class="px-btn adobe-export adobe-export-string" data-adobe-action="session" onclick="downloadSelected('string')">导出 Cookie 字符串</button>
      <button class="px-btn adobe-export adobe-export-json" data-adobe-action="session" onclick="downloadSelected('json')">导出 Cookie JSON</button>
      <button class="px-btn adobe-export adobe-export-array" data-adobe-action="session" onclick="downloadSelected('array')">导出 Cookie 数组</button>
      <button class="px-btn adobe-export adobe-export-email" data-adobe-action="email" onclick="downloadSelectedEmails()">导出账号（仅邮箱）</button>
      <button class="px-btn" data-adobe-action="session" onclick="liveCheckSelected()">测活所选</button>
      <button class="px-btn" data-adobe-action="rescue" onclick="rescueSelected()">救回所选</button>
      <button class="px-btn danger" data-adobe-action="delete" onclick="delSelected()">删除所选</button>
      <button class="px-btn ghost" onclick="clearSelection()">取消</button>
      <span id="adobe-batch-help"></span>
    </div>
    <div id="adobe-action-result" role="status" hidden></div>

    <div class="table-wrap">
      <table class="px-table">
        <thead><tr>
          <th class="col-check"><input type="checkbox" id="adobe-check-all" onclick="toggleSelectAll(this.checked)"></th>
          <th>邮箱</th><th>创建时间</th><th>状态</th><th>信息</th><th>存活</th><th>出库状态</th><th>操作</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="pager" id="pager"></div>
    </div>
  </main>
</div>

<!-- 生产 modal -->
<div class="modal-mask" id="produce-modal" style="display:none">
  <div class="modal px-panel" style="width:420px">
    <h2>生产 Adobe 账号</h2>
    <div class="import-sub">填写要生产的账号数量，后台会从「账号管理 / 邮箱管理」取号自动注册 Adobe（Firefly），邮箱验证码自动读取提交。</div>
    <label class="produce-field">
      <span>生产数量</span>
      <input id="produce-count" class="px-input" type="number" min="1" value="10">
    </label>
    <div class="modal-actions">
      <button class="px-btn" onclick="closeModal('produce-modal')">取消</button>
      <button class="px-btn primary" onclick="startProduce()">开始生产</button>
    </div>
  </div>
</div>

<!-- 日志 modal -->
<div class="modal-mask" id="code-modal" style="display:none">
  <div class="modal px-panel" style="width:420px">
    <h2>输入 Adobe 邮箱验证码</h2>
    <label for="adobe-code">邮箱收到的 6 位数字验证码</label>
    <input id="adobe-code" class="px-input" inputmode="numeric" autocomplete="one-time-code" maxlength="6">
    <div class="modal-actions">
      <button class="px-btn" onclick="closeModal('code-modal')">取消</button>
      <button class="px-btn primary" onclick="submitAdobeCode()">提交验证码</button>
    </div>
  </div>
</div>

<div class="modal-mask" id="log-modal" style="display:none">
  <div class="modal px-panel" style="width:640px">
    <h2 id="log-title">执行日志</h2>
    <pre id="log-body" class="log-body"></pre>
    <div class="modal-actions">
      <button class="px-btn ghost" id="log-shot-btn" style="display:none;margin-right:auto" onclick="viewShot()">异常截图</button>
      <button class="px-btn" onclick="closeLog()">关闭</button>
    </div>
  </div>
</div>

<!-- 异常截图 modal -->
<div class="modal-mask" id="shot-modal" style="display:none">
  <div class="modal px-panel" style="width:900px;max-width:94vw">
    <h2>异常截图</h2>
    <div style="max-height:70vh;overflow:auto;background:#000">
      <img id="shot-img" style="display:block;width:100%" alt="异常截图">
    </div>
    <div class="modal-actions">
      <button class="px-btn" onclick="closeShot()">关闭</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" style="display:none"></div>
<script src="/static/layout.js?v=4"></script>
<script src="/static/adobe.js?v=8"></script>
</body>
</html>
